<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ribosoom Runner</title>
<style>
:root{--bg:#0f172a;--p:#1e293b;--b:#334155;--t:#e2e8f0;--m:#94a3b8;--g:#10b981;--d:#3b82f6;--r:#f87171;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.6rem;margin:.2em 0;letter-spacing:.03em}h1 span{color:var(--g)}h2{margin:.2em 0;font-size:1.2rem}
.card{background:var(--p);border:1px solid var(--b);border-radius:8px;padding:14px;margin:12px 0}
.bin{border:1px solid var(--d);color:var(--d);padding:8px 12px;border-radius:6px;font-weight:600;text-align:center;margin:12px 0}
button{font:inherit;background:var(--g);color:#04130d;border:0;border-radius:6px;padding:10px 16px;cursor:pointer;font-weight:600}
button.s{background:transparent;color:var(--t);border:1px solid var(--b)}
button.x{background:transparent;color:var(--r);border:1px solid var(--r)}
button.on{border-color:var(--g);color:var(--g)}
button:disabled{opacity:.5;cursor:default}
input[type=text]{width:100%;background:var(--bg);color:var(--t);border:1px solid var(--b);border-radius:6px;padding:10px;font:inherit;margin:4px 0 10px}
input[type=text]:focus{outline:2px solid var(--d)}
input.gok{border-color:var(--g)}input.gno{border-color:var(--r)}
label{display:block;color:var(--m);font-size:.9rem}
label.o{color:var(--t);font-size:1rem;padding:4px 0;display:flex;gap:8px;align-items:flex-start}
.seq{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem;letter-spacing:.1em;color:var(--d);word-break:break-all;margin:8px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.m{color:var(--m)}.ok{color:var(--g)}.no{color:var(--r)}
.seg{font-family:ui-monospace,Menlo,monospace;background:var(--bg);color:var(--t);border:1px solid var(--b);margin:4px 4px 4px 0;letter-spacing:.1em}
.seg.sel{border-color:var(--r);color:var(--r);text-decoration:line-through}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--b);text-align:left;font-size:.92rem}th{color:var(--m)}
.hide{display:none}
.row{display:flex;gap:8px;flex-wrap:wrap}

body{background:radial-gradient(circle at 1px 1px,#1b2740 1px,transparent 0) 0 0/28px 28px,var(--bg)}
.hero{text-align:center;padding:18px 0 6px}.sub{color:var(--m);margin:0}
.logo{position:relative;width:64px;height:56px;margin:0 auto 8px}.logo i{position:absolute;border-radius:50%}
.logo i:first-child{width:46px;height:46px;background:var(--d);left:0;bottom:0}
.logo i:last-child{width:34px;height:34px;background:var(--g);right:0;top:0;border:3px solid var(--bg)}
.card{border-radius:14px}
button{border-radius:12px;padding:12px 20px;box-shadow:0 4px 0 #0a7a57}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #0a7a57}
button.s{box-shadow:0 4px 0 var(--b)}button.x{box-shadow:0 3px 0 #7f2d2d}
.big{width:100%;font-size:1.1rem;padding:14px}
.lvc{display:block;background:var(--p);border:2px solid var(--b);border-radius:14px;padding:14px;margin:10px 0;cursor:pointer;color:var(--t)}
.lvc input{display:none}.lvc b{display:block;font-size:1.05rem}.lvc span{color:var(--m);font-size:.9rem}
.lvc:has(input:checked){border-color:var(--g);background:#0f2a2a}.lvc:has(input:checked) b{color:var(--g)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;align-items:center;gap:12px}
.pgw{flex:1;height:12px;background:var(--p);border-radius:6px;overflow:hidden}
.pgw div{height:100%;width:0;background:var(--g);border-radius:6px;transition:width .3s}
.top button{padding:6px 12px;font-size:.85rem}
.stat{font-size:.9rem;color:var(--m);white-space:nowrap}.stat b{color:var(--t)}
#tk{padding-bottom:200px}
.seq{background:var(--bg);border:1px solid var(--b);border-radius:10px;padding:12px}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--p);border-top:2px solid var(--b);z-index:6}
.dock>*{max-width:728px;margin-left:auto;margin-right:auto}
.dock button{display:block;width:100%;font-size:1.05rem;padding:14px}
.dock.good{background:#06352a;border-color:var(--g)}.dock.bad{background:#3a1a22;border-color:var(--r)}
.dock.bad #go{background:var(--r);box-shadow:0 4px 0 #9b2c2c;color:#2a0a0a}
#fb{max-height:32vh;overflow:auto}#fb p{margin:0 0 8px}
input[type=text]{font-size:1.05rem;border-radius:10px;border-width:2px}.seg{border-width:2px;border-radius:10px}
.kp{display:grid;grid-template-columns:repeat(4,1fr) 1.4fr;gap:8px;margin:6px 0 12px}.kp button{padding:12px 0;font-family:ui-monospace,monospace;font-size:1.1rem}
</style></head><body><main>
<div class="hero"><div class="logo"><i></i><i></i></div><h1>Ribosoom <span>Runner</span></h1><p class="sub">Eiwitsynthese, mutaties en splicing - VWO bovenbouw</p></div>
<div id="menu">
 <div class="card"><label>Naam<input type="text" id="nm" maxlength="30"></label><label>Klas<input type="text" id="kl" maxlength="10"></label></div>
 <div class="bin">[Binas Tabel 71C vereist]</div>
 <div id="lv">
  <label class="lvc"><input type="radio" name="lv" value="1" checked><b>Level 1: Basissynthese &amp; tRNA</b><span>Transcriptie, anticodons en translatie</span></label>
  <label class="lvc"><input type="radio" name="lv" value="2"><b>Level 2: Mutaties &amp; genetische fouten</b><span>Gemuteerd DNA en mutatie-analyse</span></label>
  <label class="lvc"><input type="radio" name="lv" value="3"><b>Level 3: Eukaryotische pre-mRNA verwerking</b><span>Introns, exons en alternatieve splicing</span></label>
 </div>
 <button class="big" id="st">Start spel</button><div class="row" style="margin-top:14px"><button class="s" id="pr" style="flex:1">Oefenvragen</button><button class="s" id="kk" style="flex:1">Klassement</button></div>
 <div class="card hide" id="pc"><b>Kies thema's (geen punten, geen timer)</b>
  <label class="o"><input type="checkbox" value="tr" checked> Transcriptie &amp; tRNA</label>
  <label class="o"><input type="checkbox" value="sp" checked> Splicing (Introns/Exons)</label>
  <label class="o"><input type="checkbox" value="tl" checked> Translatie</label>
  <label class="o"><input type="checkbox" value="mu" checked> Mutaties</label>
  <button id="ps">Start oefenen</button></div>
 <p id="msg" class="no"></p>
</div>
<div id="play" class="hide">
 <div class="top"><button class="x" id="stop">Stop Game</button><button class="s hide" id="back">Menu</button><div class="pgw" id="pgw"><div id="pg"></div></div><span class="stat" id="sct">Score <b id="sc">0</b></span><span class="stat" id="tw"><b id="tm">00:00</b></span></div>
 <div class="m" id="info"></div><div id="tk"></div><div class="dock" id="dock"></div>
</div>
<div id="res" class="hide"></div>
<div id="lb" class="hide"></div>
</main>
<script>
const B="UCAG",AA="FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG";
const N={F:"Phe",L:"Leu",S:"Ser",Y:"Tyr","*":"Stop",C:"Cys",W:"Trp",P:"Pro",H:"His",Q:"Gln",R:"Arg",I:"Ile",M:"Met",T:"Thr",N:"Asn",K:"Lys",V:"Val",A:"Ala",D:"Asp",E:"Glu",G:"Gly"};
const aa=c=>N[AA[16*B.indexOf(c[0])+4*B.indexOf(c[1])+B.indexOf(c[2])]];
const R=a=>a[Math.floor(Math.random()*a.length)];
const nt=n=>Array.from({length:n},()=>R(B)).join("");
const cod=()=>{let c;do c=nt(3);while(aa(c)=="Stop");return c};
const STOP=()=>R(["UAA","UAG","UGA"]);
const tmpl=m=>[...m].map(x=>({A:"T",U:"A",G:"C",C:"G"}[x])).join("");
const anti=m=>[...m].map(x=>({A:"U",U:"A",G:"C",C:"G"}[x])).join("");
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
const s3=s=>s.match(/.{1,3}/g)||[];
const nrm=s=>s.toUpperCase().replace(/[^A-Z]/g,"");
const tok=s=>s.split(/[\s,.\-–>]+/).filter(Boolean).map(w=>{w=w.toLowerCase();return w[0].toUpperCase()+w.slice(1)});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
function prot(m){const o=[];for(const c of s3(m)){if(c.length<3)break;const a=aa(c);o.push(a);if(a=="Stop")break}return o}
const dna=m=>"3' - "+s3(tmpl(m)).join(" ")+" - 5'";
function mc(q,arr,c){const i=sh([0,1,2,3]);return{q,o:i.map(k=>arr[k]),c:i.indexOf(c)}}

/* Taken */
const t1a=()=>{const m=Array.from({length:4},cod).join("");return{th:"tr",ph:"Fase 1: Transcriptie",q:"Transcribeer deze DNA-matrijsstreng (3' naar 5') naar mRNA (5' naar 3').",seq:dna(m),in:[{l:"mRNA (5' - 3')",a:m,k:"s"}],ex:"RNA-polymerase leest de matrijsstreng van 3' naar 5' en bouwt het mRNA van 5' naar 3' op. Koppeling: A-U, T-A, C-G, G-C."}};
const t1b=()=>{const c=[cod(),cod(),cod()];return{th:"tr",ph:"Fase 2: tRNA-anticodons",q:"Vul per mRNA-codon het bijbehorende tRNA-anticodon in (3' naar 5').",seq:"mRNA 5' - "+c.join(" ")+" - 3'",in:c.map(x=>({l:"Anticodon bij "+x,a:anti(x),k:"s"})),ex:"Het anticodon is antiparallel en complementair aan het codon (A-U, C-G). Geschreven van 3' naar 5' volgt het dus letter voor letter het complement."}};
const t1c=()=>{const c=[cod(),cod(),cod(),STOP()];return{th:"tl",ph:"Fase 3: Translatie",bin:1,q:"Typ per codon de 3-letterige aminozuurcode (bijv. Met, Lys, Val, Stop).",seq:"mRNA 5' - "+c.join(" ")+" - 3'",in:c.map(x=>({l:"Codon "+x,a:aa(x),k:"a"})),ex:"Zoek elk codon op in Binas tabel 71C. Het ribosoom stopt bij een stopcodon (UAA, UAG of UGA); hiervoor bestaat geen tRNA."}};
function mut(type){for(;;){const w="AUG"+cod()+cod()+cod()+cod()+STOP();const ci=1+Math.floor(Math.random()*4),p=ci*3+Math.floor(Math.random()*3);
 if(type==3){const m=w.slice(0,p)+w.slice(p+1);if(prot(m).join()!=prot(w).join())return{w,m};continue}
 const m=w.slice(0,p)+R(B)+w.slice(p+1);const a=aa(w.substr(ci*3,3)),b=aa(m.substr(ci*3,3));
 if((type==0&&a==b&&m!=w)||(type==1&&a!=b&&b!="Stop")||(type==2&&b=="Stop"))return{w,m}}}
const MT=["Stille mutatie (substitutie)","Missense mutatie (substitutie)","Nonsense mutatie (substitutie)","Frameshift (deletie/insertie)"];
const EF=["Geen verandering in de aminozuurvolgorde; tertiaire structuur blijft gelijk","Eén aminozuur is vervangen; tertiaire structuur kan lokaal veranderen","Voortijdig stopcodon: een te kort eiwit dat meestal niet functioneel vouwt","Alle aminozuren na de mutatie veranderen; tertiaire structuur sterk verstoord"];
const MX=["Stille mutatie: het codon verandert, maar codeert door de redundantie van de code voor hetzelfde aminozuur. Primaire en tertiaire structuur blijven gelijk.","Missense: een ander aminozuur wordt ingebouwd. De zijketen kan andere bindingen vormen, waardoor de tertiaire structuur kan veranderen.","Nonsense: er ontstaat een voortijdig stopcodon. Het eiwit is te kort en meestal niet functioneel.","Frameshift: deletie of insertie (geen drievoud) verschuift het leesraam. Alle aminozuren erna veranderen en de tertiaire structuur raakt sterk verstoord."];
const t2a=()=>{const ty=R([0,1,2,3]),{m}=mut(ty);return{th:"mu",ph:"Fase 1: Transcriptie en translatie van gemuteerd DNA",bin:1,q:"Transcribeer deze gemuteerde matrijsstreng en translateer het mRNA (bijv. Met - Lys - Stop).",seq:dna(m),in:[{l:"mRNA (5' - 3')",a:m,k:"s"},{l:"Aminozuren (gescheiden door streepjes)",a:prot(m),k:"l"}],ex:"Transcribeer eerst naar mRNA en lees dan vanaf het startcodon in drietallen tot het stopcodon (of tot het einde)."}};
const t2b=()=>{const ty=R([0,1,2,3]),{w,m}=mut(ty);return{th:"mu",ph:"Fase 2: Mutatie-analyse",q:"Vergelijk het wildtype eiwit met het gemuteerde eiwit.",seq:"Wildtype: "+prot(w).join(" - ")+"<br>Gemuteerd: "+prot(m).join(" - "),mc:[mc("Welk type mutatie heeft plaatsgevonden?",MT,ty),mc("Wat is het effect op eiwitstructuur en vouwing?",EF,ty)],ex:MX[ty]}};
function gene(n){const iv=()=>"GU"+nt(4)+"AG";const g=[{t:"AUG"+cod(),i:0}];
 for(let k=0;k<n;k++){g.push({t:iv(),i:1});g.push({t:k==n-1?cod()+STOP():cod(),i:0})}
 return{g,pre:g.map(s=>s.t).join(""),mat:g.filter(s=>!s.i).map(s=>s.t).join("")}}
const t3a=()=>{const x=gene(1);return{th:"tr",ph:"Fase 1: Transcriptie naar pre-mRNA",q:"Transcribeer dit eukaryotische gen (matrijsstreng) naar pre-mRNA (5' naar 3'). Het pre-mRNA bevat nog introns.",seq:dna(x.pre),in:[{l:"pre-mRNA (5' - 3')",a:x.pre,k:"s"}],ex:"Bij eukaryoten wordt eerst pre-mRNA gemaakt, inclusief introns en exons. Koppeling: A-U, T-A, C-G, G-C."}};
const t3b=(x=gene(2))=>({th:"sp",ph:"Fase 2: Splicing (spliceosoom)",q:"Selecteer de introns (niet-coderend, beginnen met GU en eindigen met AG) om ze te verwijderen.",seq:"pre-mRNA: "+x.pre,sp:x.g,ex:"Het spliceosoom knipt de introns eruit en verbindt de exons. Rijp mRNA: "+x.mat});
const t3c=(x=gene(2))=>({th:"tl",ph:"Fase 3: Translatie van rijp mRNA",bin:1,q:"Translateer het rijpe mRNA: typ per codon de aminozuurcode.",seq:"rijp mRNA 5' - "+s3(x.mat).join(" ")+" - 3'",in:s3(x.mat).map(c=>({l:"Codon "+c,a:aa(c),k:"a"})),ex:"Alleen de exons blijven over in het rijpe mRNA. Lees vanaf AUG in drietallen en gebruik Binas 71C."});
const t3d=()=>({th:"sp",ph:"Fase 3: Alternatieve splicing",q:"Alternatieve splicing en eiwitdiversiteit.",mc:[mc("Wat is het gevolg van alternatieve splicing, waarbij een exon wordt overgeslagen?",["Uit één gen ontstaan verschillende mRNA's en dus verschillende eiwitten","Het gen muteert en het DNA wordt korter","Er ontstaat geen mRNA meer van dit gen","Het ribosoom slaat het startcodon over zonder gevolg"],0)],ex:"Door verschillende combinaties van exons kan één gen coderen voor meerdere eiwitten; dit vergroot de eiwitdiversiteit zonder dat het DNA verandert."});
const LV={1:()=>[t1a(),t1a(),t1b(),t1b(),t1c(),t1c()],2:()=>[t2a(),t2a(),t2b(),t2b(),t2b()],3:()=>{const x=gene(2);return[t3a(),t3b(x),t3c(x),t3d()]}};
const POOL={tr:[t1a,t1b,t3a],sp:[()=>t3b(),()=>t3b(gene(1)),t3d],tl:[t1c,()=>t3c(gene(1)),()=>t3c()],mu:[t2a,t2b]};

const HT={tr:"Het complement: A-U, T-A, C-G, G-C. Een anticodon is het complement van het codon.",tl:"Zoek elk codon op in Binas 71C en lees in drietallen vanaf AUG.",mu:"Maak eerst het mRNA (complement van de matrijsstreng), lees in drietallen en vergelijk met het wildtype: waar begint het verschil?",sp:"Introns beginnen met GU en eindigen met AG. Alleen de exons blijven over en worden aan elkaar gezet."};
/* Engine */
let S=null;
function scr(id){["menu","play","res","lb"].forEach(x=>$("#"+x).classList.toggle("hide",x!=id))}
const mmss=ms=>{const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
const tick=()=>{if(S&&S.mode=="game")$("#tm").textContent=mmss(Date.now()-S.t0)};
const pick=()=>R(R(S.pools))();
function setMode(g){["tw","stop","sct","pgw"].forEach(i=>$("#"+i).classList.toggle("hide",!g));$("#back").classList.toggle("hide",g)}
$("#st").onclick=()=>{const n=$("#nm").value.trim();if(!n){$("#msg").textContent="Vul eerst je naam in.";return}
 $("#msg").textContent="";const l=+document.querySelector("input[name=lv]:checked").value;
 S={mode:"game",lvl:l,q:LV[l](),i:0,score:0,t0:Date.now(),stats:{tr:[0,0],sp:[0,0],tl:[0,0],mu:[0,0]}};setMode(1);$("#sc").textContent="0";S.tm=setInterval(tick,500);tick();scr("play");render()};
$("#pr").onclick=()=>$("#pc").classList.toggle("hide");
$("#ps").onclick=()=>{const p=[...document.querySelectorAll("#pc input:checked")].map(i=>POOL[i.value]);
 if(!p.length){$("#msg").textContent="Kies minimaal één thema.";return}$("#msg").textContent="";
 S={mode:"practice",pools:p};S.cur=pick();setMode(0);scr("play");render()};
$("#stop").onclick=()=>{clearInterval(S.tm);S=null;scr("menu")};
$("#back").onclick=()=>{S=null;scr("menu")};
$("#kk").onclick=()=>lb("0");
$("#tk").onclick=e=>{if(!S||S.done)return;const b=e.target.closest(".seg");if(b){b.classList.toggle("sel");return}
 if(e.target.id=="hint"){const t=S.t;let h=HT[t.th];if(t.in){const f=t.in[0],a=Array.isArray(f.a)?f.a[0]:f.a;h+=" Het eerste antwoord begint met: "+a.slice(0,f.k=="s"?2:1)+"...";}
  if(S.mode=="game")S.hint=1;$("#ht").textContent=h+(S.mode=="game"?" (-1 punt)":"");return}
 const k=e.target.closest("#kp button");if(!k)return;const ins=[...document.querySelectorAll("#tk input[type=text]")];const el=S.f&&ins.includes(S.f)?S.f:ins[0];
 if(k.dataset.d)el.value=el.value.slice(0,-1);else el.value+=k.dataset.l;S.f=el;el.focus();
 const f=S.t.in[+el.dataset.j];if(f.k=="s"&&nrm(el.value).length>=f.a.length){const n=ins[ins.indexOf(el)+1];if(n){S.f=n;n.focus()}}};
document.addEventListener("focusin",e=>{if(S&&e.target.matches&&e.target.matches("#tk input[type=text]"))S.f=e.target});
document.addEventListener("keydown",e=>{if(e.key!="Enter"||!S||$("#play").classList.contains("hide")||e.target.tagName=="BUTTON")return;
 const ins=[...document.querySelectorAll("#tk input[type=text]")],i=ins.indexOf(e.target);
 if(!S.done&&i>=0&&i<ins.length-1){ins[i+1].focus();return}e.preventDefault();go()});

function render(){const t=S.mode=="game"?S.q[S.i]:S.cur;S.t=t;S.done=0;S.hint=0;S.f=null;
 $("#info").textContent=S.mode=="game"?`Level ${S.lvl} - vraag ${S.i+1}/${S.q.length}`:"Oefenmodus";
 let h=`<div class="card"><b class="ok">${t.ph}</b><p>${t.q}</p>`;
 if(t.bin)h+=`<div class="bin">[Binas Tabel 71C vereist]</div>`;
 if(t.seq)h+=`<div class="seq">${t.seq}</div>`;
 if(t.sp)h+=`<div>`+t.sp.map((s,k)=>`<button class="seg s" data-k="${k}">${s.t}</button>`).join("")+`</div>`;
 if(t.in)h+=t.in.map((f,j)=>`<label>${f.l}<input type="text" autocomplete="off" autocapitalize="off" spellcheck="false" data-j="${j}"${f.k=="s"?' inputmode="none"':''}></label>`).join("");
 if(t.mc)h+=t.mc.map((m,j)=>`<div><p><b>${m.q}</b></p>`+m.o.map((o,k)=>`<label class="o"><input type="radio" name="m${j}" value="${k}"> ${o}</label>`).join("")+`</div>`).join("");
 if(t.in&&t.in.some(f=>f.k=="s"))h+=`<div class="kp" id="kp">`+["A","U","C","G"].map(c=>`<button class="s" data-l="${c}">${c}</button>`).join("")+`<button class="s" data-d="1">Wis</button></div>`;
 h+=`<div id="ht" class="m"></div><p><button class="s" id="hint">Hint${S.mode=="game"?" (-1 punt)":""}</button></p></div>`;
 $("#tk").innerHTML=h;$("#dock").className="dock";$("#dock").innerHTML='<div id="fb"></div><button id="go">Controleer</button>';$("#go").onclick=go;if(S.mode=="game")$("#pg").style.width=(S.i/S.q.length*100)+"%";window.scrollTo(0,0)}
function go(){if(!S.done)return check();
 if(S.mode=="game"){S.i++;S.i<S.q.length?render():finish()}else{S.cur=pick();render()}}
function check(){const t=S.t;let ok=0,tot=0;const wr=[];
 document.querySelectorAll("#tk input[type=text]").forEach(el=>{const f=t.in[+el.dataset.j],v=el.value;
  const a=f.k=="s"?nrm(v)==f.a:f.k=="a"?tok(v).join()==f.a:tok(v).join()==f.a.join();
  el.classList.add(a?"gok":"gno");el.disabled=true;tot++;if(a)ok++;else wr.push(`${f.l}: <b>${Array.isArray(f.a)?f.a.join(" - "):f.a}</b>`)});
 if(t.sp){const g=[...document.querySelectorAll(".seg")];const a=g.every((b,k)=>b.classList.contains("sel")==!!t.sp[k].i);tot++;if(a)ok++;else wr.push("Introns: "+t.sp.filter(s=>s.i).map(s=>s.t).join(" en "))}
 if(t.mc)t.mc.forEach((m,j)=>{const c=document.querySelector(`input[name=m${j}]:checked`);const a=c&&+c.value==m.c;tot++;if(a)ok++;else wr.push(`${m.q} <b>${m.o[m.c]}</b>`)});
 document.querySelectorAll("#tk input[type=radio]").forEach(r=>r.disabled=true);
 const pts=Math.max(0,Math.round(100*ok/tot)/10-(S.mode=="game"&&S.hint?1:0));if(S.mode=="game"){S.stats[t.th][0]+=pts;S.stats[t.th][1]+=10}
 if(S.mode=="game"){S.score=Math.round((S.score+pts)*10)/10;$("#sc").textContent=S.score.toFixed(1).replace(".",",")}
 let f=ok==tot?`<p class="ok"><b>Goed.</b>${S.mode=="game"?" +"+pts.toFixed(1).replace(".",",")+" punten.":""}</p>`:`<p class="no"><b>${ok}/${tot} goed.</b>${S.mode=="game"?` +${pts.toFixed(1).replace(".",",")} punten.`:""}</p><p>Correct:<br>${wr.join("<br>")}</p>`;
 if(S.mode=="practice"||ok<tot)f+=`<p class="m">${t.ex}</p>`;
 $("#fb").innerHTML=f;S.done=1;$("#hint").disabled=true;$("#dock").className="dock "+(ok==tot?"good":"bad");if(S.mode=="game")$("#pg").style.width=((S.i+1)/S.q.length*100)+"%";
 $("#go").textContent=S.mode=="game"&&S.i==S.q.length-1?"Afronden":"Volgende"}

function finish(){clearInterval(S.tm);const ms=Date.now()-S.t0,max=S.q.length*10;
 const g=Math.max(1,Math.min(10,1+9*S.score/max));const gs=g.toFixed(1).replace(".",",");
 const all=LB();all.push({n:$("#nm").value.trim(),k:$("#kl").value.trim(),l:S.lvl,s:S.score,t:ms,g:gs,d:Date.now()});saveLB(all);
 const st=S.stats,TN={tr:"Transcriptie &amp; tRNA",sp:"Splicing",tl:"Translatie",mu:"Mutaties"};
 const rows=Object.keys(st).filter(k=>st[k][1]).map(k=>({k,p:Math.round(100*st[k][0]/st[k][1])}));
 const weak=rows.filter(r=>r.p<100).map(r=>POOL[r.k]);
 $("#res").innerHTML=`<div class="card"><h2>Resultaat Level ${S.lvl}</h2><p>Naam: ${esc($("#nm").value)}<br>Score: <b>${S.score.toFixed(1).replace(".",",")} / ${max}</b><br>Tijd: <b>${mmss(ms)}</b><br>VWO-cijfer: <b class="ok">${gs}</b></p></div>
 <div class="card"><h2>Per thema</h2><table>${rows.map(r=>`<tr><td>${TN[r.k]}</td><td style="width:40%"><div class="pgw"><div style="width:${r.p}%;background:${r.p<100?"var(--d)":"var(--g)"}"></div></div></td><td>${r.p}%</td></tr>`).join("")}</table>
 <p>${weak.length?`<button class="big" id="r3">Oefen mijn fouten</button>`:`<span class="ok">Alle thema's volledig goed.</span>`}</p></div>
 <div class="row"><button id="r1">Hoofdmenu</button><button class="s" id="r2">Klassement</button></div>`;
 S=null;scr("res");$("#r1").onclick=()=>scr("menu");$("#r2").onclick=()=>lb("0");
 if(weak.length)$("#r3").onclick=()=>{S={mode:"practice",pools:weak};S.cur=pick();setMode(0);scr("play");render()}}

/* Klassement */
const LB=()=>{try{return JSON.parse(localStorage.getItem("rr_lb")||"[]")}catch(e){return[]}};
const saveLB=a=>{try{localStorage.setItem("rr_lb",JSON.stringify(a))}catch(e){}};
function lb(f){let a=LB();if(f!="0")a=a.filter(x=>x.l==+f);a.sort((x,y)=>y.s-x.s||x.t-y.t);a=a.slice(0,20);
 $("#lb").innerHTML=`<div class="card"><h2>Klassement</h2><div class="row">`+["0","1","2","3"].map(k=>`<button class="s ${k==f?"on":""}" data-f="${k}">${k=="0"?"Alle levels":"Level "+k}</button>`).join("")+`</div>`+
 (a.length?`<table><tr><th>#</th><th>Naam</th><th>Klas</th><th>Lv</th><th>Score</th><th>Tijd</th><th>Cijfer</th></tr>`+a.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.n)}</td><td>${esc(x.k)}</td><td>${x.l}</td><td>${String(x.s).replace(".",",")}</td><td>${mmss(x.t)}</td><td>${esc(x.g)}</td></tr>`).join("")+`</table>`:`<p class="m">Nog geen resultaten.</p>`)+
 `<p><button id="lm">Hoofdmenu</button></p></div>`;scr("lb");$("#lm").onclick=()=>scr("menu");
 document.querySelectorAll("#lb [data-f]").forEach(b=>b.onclick=()=>lb(b.dataset.f))}
</script></body></html>
